context:
  name: libmongoc
  version: "2.5.10"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/mongodb/mongo-c-driver/releases/download/${{ version }}/mongo-c-driver-${{ version }}.tar.gz
  sha256: 4ffc91ffc7f9811446bbfa467ca3f89d4372f72c8a2c6a0830631a6da09d14d6
  patches:
    # conda-forge's libbson ships no static library; don't require it
    - fix-static-dep.patch

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja
    - pkgconf
  host:
    # mongoc's CMake requires libbson >= its own version (same major)
    - libbson ==${{ version }}
    - snappy
    - zlib
    - zstd
    - if: unix
      then:
        - openssl
        - cyrus-sasl
  run_exports:
    # libmongoc 2.x installs libmongoc2 and is ABI-stable within the major version
    - ${{ pin_subpackage(name, upper_bound='x') }}

tests:
  - package_contents:
      include:
        - mongoc-${{ version }}/mongoc/mongoc.h
      files:
        - if: unix
          then:
            - lib/pkgconfig/mongoc2.pc
            - lib/libmongoc2${{ ".so" if linux else ".dylib" }}
          else:
            - Library/lib/mongoc2.dll.lib
            - Library/bin/mongoc2.dll
        - if: unix
          then:
            - lib/cmake/mongoc-${{ version }}/mongocConfig.cmake
          else:
            - Library/lib/cmake/mongoc-${{ version }}/mongocConfig.cmake
  - if: unix
    then:
      script:
        - pkg-config --exists "mongoc2 = ${{ version }}"
        - test ! -f $PREFIX/lib/libmongoc2.a
      requirements:
        run:
          - pkgconf

about:
  homepage: https://github.com/mongodb/mongo-c-driver
  repository: https://github.com/mongodb/mongo-c-driver
  documentation: https://www.mongoc.org/libmongoc/current/
  license: Apache-2.0
  license_file:
    - COPYING
    - THIRD_PARTY_NOTICES
  summary: A high-performance MongoDB driver for C

extra:
  recipe-maintainers:
    - Tobias-Fischer
